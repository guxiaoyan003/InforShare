<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>职位广场 - DAKA · 牛人工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="jobs">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="content">
      <section class="view active" id="view-jobs">
      <div class="page-head">
      <div>
      <h1>职位广场</h1>
      <p>共 <b id="jobTotal" style="color:var(--blue-600)">0</b> 个在招职位 · 已为你过滤关闭与未过审岗位 · 更新于 2026-10-20 17:30</p>
      </div>
      <div class="head-ops">
      <button class="btn" id="btnGoApplyFromJobs">我的申请</button>
      <button class="btn" id="btnRefreshRec">刷新推荐</button>
      </div>
      </div>

      <div class="toolbar-card">
      <div class="search-row">
      <div class="kw-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.1" cy="7.1" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input class="ctrl" id="jobKw" placeholder="搜索职位名称、企业名称，如「产品经理」「云启科技」">
      <span class="enter">Enter</span>
      </div>
      <select class="ctrl" id="jobCity">
      <option value="">全部城市</option>
      <option>深圳</option><option>广州</option><option>杭州</option><option>成都</option>
      <option>南京</option><option>武汉</option><option>北京</option><option>上海</option>
      </select>
      <button class="btn btn-primary btn-lg" id="btnJobSearch">搜索职位</button>
      </div>
      <div class="filter-row">
      <select class="ctrl ctrl-sm" id="jobType">
      <option value="">全部类型</option>
      <option value="1">全职</option><option value="2">实习</option><option value="3">兼职</option>
      <option value="4">零工 / 日结</option><option value="5">劳务派遣</option>
      </select>
      <select class="ctrl ctrl-sm" id="jobSalary">
      <option value="">不限薪资</option>
      <option value="8">8K 以上</option><option value="12">12K 以上</option><option value="20">20K 以上</option>
      </select>
      <select class="ctrl ctrl-sm" id="jobYears">
      <option value="">全部经验</option>
      <option value="不限">经验不限</option><option value="1">1-3 年</option>
      <option value="3">3-5 年</option><option value="5">5 年以上</option>
      </select>
      <select class="ctrl ctrl-sm" id="jobEdu">
      <option value="">全部学历</option>
      <option value="不限">学历不限</option><option value="高中">高中 / 中专</option>
      <option value="大专">大专</option><option value="本科">本科</option><option value="硕士">硕士及以上</option>
      </select>
      <span class="divider"></span>
      <select class="ctrl ctrl-sm" id="jobSort" style="width:132px;flex:0 0 132px">
      <option value="new">最新发布</option>
      <option value="salary">薪资从高到低</option>
      <option value="hot">最多人申请</option>
      </select>
      <button class="link gray" id="btnJobReset" style="font-size:12px">重置筛选</button>
      <span class="result">共 <b id="jobCount">0</b> 个职位</span>
      </div>
      </div>
      <div class="job-grid bleed" id="jobGrid"></div>
      <div class="pager plain" id="jobPager"></div>
      </section>
    </div>
  </div>
</div>
<div id="layerRoot"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/apply-modal.js"></script>
<script src="assets/jobs.js"></script>
</body>
</html>
