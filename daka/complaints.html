<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投诉反馈 - DAKA · 牛人工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="complaint">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="content">
      <section class="view" id="view-complaint">
      <div class="page-head">
      <div>
      <h1>投诉反馈</h1>
      <p>遇到虚假职位、薪资不符或骚扰，可在此提交 · 平台在 1 个工作日内受理</p>
      </div>
      <div class="head-ops">
      <button class="btn" id="btnComplaintNotice">投诉须知</button>
      <button class="btn btn-primary" id="btnComplaintNew">发起投诉</button>
      </div>
      </div>

      <div class="card">
      <div class="card-head">
      <h2>我的投诉记录</h2>
      <span class="sub" id="cpCount">0 条</span>
      <div class="spacer"></div>
      <span class="hint" style="font-size:11.5px">处理结果会以站内消息通知</span>
      </div>
      <div class="table-wrap">
      <table style="min-width:880px">
      <thead>
      <tr>
      <th style="min-width:230px">投诉对象</th>
      <th style="width:180px">投诉类型</th>
      <th style="min-width:260px">问题描述</th>
      <th style="width:150px">提交时间</th>
      <th style="width:104px">状态</th>
      <th style="width:136px">操作</th>
      </tr>
      </thead>
      <tbody id="cpTbody"></tbody>
      </table>
      </div>
      </div>
      </section>
    </div>
  </div>
</div>
<div id="layerRoot"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/complaints.js"></script>
</body>
</html>
