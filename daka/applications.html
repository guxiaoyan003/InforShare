<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的申请 - DAKA · 牛人工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="applies">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="content">
      <section class="view" id="view-applies">
      <div class="page-head">
      <div>
      <h1>我的申请</h1>
      <p>投递出去的每一份申请都在这里 · 支持查看进度、修改求职信息、撤回申请</p>
      </div>
      <div class="head-ops">
      <button class="btn" id="btnExportApply">导出记录</button>
      <button class="btn btn-primary" id="btnGoJobs2">去投递</button>
      </div>
      </div>

      <div class="stat-row" id="applyStats"></div>
      <div class="toolbar-card">
      <div class="filter-row" style="padding:14px 18px">
      <div class="kw-wrap" style="max-width:300px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.1" cy="7.1" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input class="ctrl ctrl-sm" id="applyKw" placeholder="搜索职位 / 企业" style="padding-left:36px;height:32px">
      </div>
      <select class="ctrl ctrl-sm" id="applyType">
      <option value="">全部类型</option>
      <option value="岗位">岗位</option>
      <option value="项目">项目</option>
      </select>
      <select class="ctrl ctrl-sm" id="applyStatus">
      <option value="">全部进度</option>
      <option value="1">已投递</option>
      <option value="2">沟通中</option>
      <option value="3">不合适</option>
      <option value="4">已撤回</option>
      </select>
      <span class="divider"></span>
      <select class="ctrl ctrl-sm" id="applySort" style="width:132px;flex:0 0 132px">
      <option value="new">投递时间从新到旧</option>
      <option value="old">投递时间从旧到新</option>
      <option value="status">按进度排序</option>
      </select>
      <button class="link gray" id="btnApplyReset" style="font-size:12px">重置</button>
      <span class="result">共 <b id="applyCount">0</b> 条</span>
      </div>
      </div>
      <div class="card">
      <div class="table-wrap" style="border-top:0">
      <table style="min-width:1080px">
      <thead>
      <tr>
      <th style="min-width:250px">申请对象</th>
      <th style="width:80px">类型</th>
      <th style="width:116px">薪资 / 预算</th>
      <th style="width:146px">投递时间</th>
      <th style="width:104px">进度状态</th>
      <th style="min-width:180px">企业反馈</th>
      <th style="width:154px">操作</th>
      </tr>
      </thead>
      <tbody id="applyTbody"></tbody>
      </table>
      </div>
      <div class="pager" id="applyPager"></div>
      </div>
      </section>
    </div>
  </div>
</div>
<div id="layerRoot"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/applications.js"></script>
</body>
</html>
