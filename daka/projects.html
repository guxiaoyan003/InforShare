<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>项目机会 - DAKA · 牛人工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="projects">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="content">
      <section class="view" id="view-projects">
      <div class="page-head">
      <div>
      <h1>项目机会</h1>
      <p>企业 / 政府 / 个人发布的短期项目 · 可按项目制结算，适合灵活接单</p>
      </div>
      <div class="head-ops">
      <button class="btn" id="btnGoApplyFromProj">我的申请</button>
      </div>
      </div>

      <div class="toolbar-card">
      <div class="search-row">
      <div class="kw-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.1" cy="7.1" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input class="ctrl" id="projKw" placeholder="搜索项目名称、分类关键词，如「品牌全案」「小程序」">
      </div>
      <select class="ctrl" id="projBase">
      <option value="">全部 Base 地</option>
      <option>深圳</option><option>广州</option><option>杭州</option><option>成都</option>
      <option>南京</option><option>北京</option><option>上海</option><option>苏州</option>
      </select>
      <button class="btn btn-primary btn-lg" id="btnProjSearch">搜索项目</button>
      </div>
      <div class="filter-row">
      <select class="ctrl ctrl-sm" id="projType">
      <option value="">全部发布方</option>
      <option>企业</option><option>政府</option><option>个人</option>
      </select>
      <select class="ctrl ctrl-sm" id="projCoop">
      <option value="">全部合作方式</option>
      <option>线上</option><option>线下</option>
      </select>
      <select class="ctrl ctrl-sm" id="projBudget">
      <option value="">不限预算</option>
      <option value="50">50 万以上</option><option value="100">100 万以上</option><option value="200">200 万以上</option>
      </select>
      <span class="divider"></span>
      <select class="ctrl ctrl-sm" id="projSort" style="width:132px;flex:0 0 132px">
      <option value="new">最新发布</option>
      <option value="budget">预算从高到低</option>
      <option value="deadline">截止日期最近</option>
      </select>
      <button class="link gray" id="btnProjReset" style="font-size:12px">重置筛选</button>
      <span class="result">共 <b id="projCount">0</b> 个项目</span>
      </div>
      </div>
      <div class="job-grid bleed" id="projGrid"></div>
      </section>
    </div>
  </div>
</div>
<div id="layerRoot"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/apply-modal.js"></script>
<script src="assets/projects.js"></script>
</body>
</html>
